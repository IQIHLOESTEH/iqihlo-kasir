<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IQIHLO ES TEH — Kurir</title><style>
:root{--p:#ff9b21;--bg:#f7f8fa;--ink:#202124;--muted:#6b7280;--line:#e6e8ec;--ok:#138a4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);padding:15px 16px;position:sticky;top:0;z-index:5}.brand{font-weight:900;font-size:20px}.sub{font-size:12px;color:var(--muted)}main{max-width:720px;margin:auto;padding:14px 14px 40px}.panel,.order{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.grid{display:grid;gap:10px}.order h3{margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.money{font-size:20px;font-weight:900}.badge{display:inline-block;border-radius:999px;padding:5px 9px;background:#fff0dc;font-weight:800;font-size:12px}.row{display:flex;gap:8px}.row>*{flex:1}input,button{font:inherit}input{width:100%;padding:12px;border:1px solid #d9dce1;border-radius:12px}button{border:0;border-radius:12px;padding:11px 13px;font-weight:800}.primary{background:var(--p);color:#111}.dark{background:#202124;color:#fff}.danger{background:#ffe5e5;color:#9b1c1c}.hidden{display:none!important}a{color:#b35d00;font-weight:800}
</style></head><body><header><div class="brand">IQIHLO ES TEH • KURIR</div><div class="sub" id="who">Belum login</div></header><main>
<section id="login" class="panel"><h2>Login Kurir</h2><input id="email" type="email" placeholder="Email kurir"><br><br><input id="pass" type="password" placeholder="Password Firebase"><br><br><button class="primary" onclick="login()">MASUK</button><p class="muted">Akun kurir harus dibuat di Firebase Authentication dan diberi dokumen users/{uid} dengan role KURIR.</p></section>
<section id="app" class="hidden"><div class="row"><button class="dark" onclick="loadOrders()">↻ Refresh</button><button class="danger" onclick="logout()">Keluar</button></div><br><div id="list" class="grid"></div></section></main>
<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyCVIeE-CDyaNDTU9DuvxKMRPY4wH-6Rp-o",authDomain:"iqihlo-es-teh.firebaseapp.com",projectId:"iqihlo-es-teh",storageBucket:"iqihlo-es-teh.firebasestorage.app",messagingSenderId:"382120711455",appId:"1:382120711455:web:5281431a89a3cf2de08c2a",measurementId:"G-VGG6XWQ5GL"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();let me=null;
const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function login(){let e=email.value.trim(),p=pass.value;if(!e||!p)return alert('Email dan password wajib.');try{let c=await auth.signInWithEmailAndPassword(e,p);let u=await db.collection('users').doc(c.user.uid).get();if(!u.exists||String(u.data().role||'').toUpperCase()!=='KURIR'){await auth.signOut();return alert('Akun ini bukan akun KURIR.');}me={uid:c.user.uid,name:u.data().name||e};document.querySelector('#login').classList.add('hidden');document.querySelector('#app').classList.remove('hidden');document.querySelector('#who').textContent=me.name;loadOrders()}catch(e){alert('Login gagal: '+(e.message||e))}}
async function loadOrders(){if(!me)return;let q=await db.collection('orders').where('status','in',['BARU','DIPROSES','DIANTAR']).orderBy('createdAt','desc').limit(30).get().catch(()=>null);if(!q){list.innerHTML='<div class="panel">Pesanan belum bisa dibaca. Periksa Firestore Rules/index.</div>';return}list.innerHTML=q.empty?'<div class="panel">Tidak ada pesanan aktif.</div>':q.docs.map(d=>card(d.id,d.data())).join('')}
function card(id,o){let items=(o.items||[]).map(x=>`${esc(x.name)} × ${x.qty}`).join(', ');let action='';if(o.status==='BARU')action=`<button class="primary" onclick="claim('${id}')">AMBIL PESANAN</button>`;else if(o.status==='DIPROSES'&&o.courierUid===me.uid)action=`<button class="primary" onclick="status('${id}','DIANTAR')">BERANGKAT ANTAR</button>`;else if(o.status==='DIANTAR'&&o.courierUid===me.uid)action=`<button class="dark" onclick="status('${id}','SELESAI')">SUDAH DITERIMA PELANGGAN</button>`;return `<article class="order"><h3>${esc(o.name)} <span class="badge">${esc(o.status)}</span></h3><div class="muted">${esc(o.phone)}<br>${esc(o.address)}</div><p>${items}</p><div class="money">${rp(o.total||0)}</div><div class="muted">Pembayaran: ${esc(o.payment||'COD')} • Jarak: ${esc(o.distanceKm??'-')} km • Ongkir: ${rp(o.deliveryFee||0)}</div>${o.customerLat&&o.customerLng?`<br><a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(o.customerLat+','+o.customerLng)}" target="_blank">📍 BUKA RUTE DI MAPS</a>`:''}<br>${action}</article>`}
async function claim(id){await db.collection('orders').doc(id).update({status:'DIPROSES',courierUid:me.uid,courierName:me.name,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});loadOrders()}
async function status(id,s){await db.collection('orders').doc(id).update({status:s,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});loadOrders()}
async function logout(){await auth.signOut();me=null;location.reload()}
</script></body></html>
