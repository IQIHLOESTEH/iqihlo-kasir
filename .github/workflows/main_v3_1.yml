name: Buat APK IQIHLO ES TEH V3.1 PREMIUM

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Ambil kode
        uses: actions/checkout@v6

      - name: Siapkan Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Buat proyek Android PREMIUM
        shell: bash
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/iqihlo/esteh
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable

          cat > android/app/src/main/res/drawable/ic_launcher.xml <<'ICONEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#8D5200" android:pathData="M22,24 L76,24 L76,66 C76,78 66,86 54,86 C42,86 32,78 32,66 L32,34 L22,34 L22,24 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M32,34 L66,34 L66,62 C66,70 61,76 54,76 C47,76 42,70 42,62 L42,42 L32,42 Z" />
              <path android:fillColor="#D38A00" android:pathData="M76,40 L84,40 C91,40 96,45 96,52 C96,59 91,64 84,64 L76,64 L76,57 L83,57 C86,57 88,55 88,52 C88,49 86,47 83,47 L76,47 Z" />
              <path android:fillColor="#D38A00" android:pathData="M42,24 L66,24 L62,16 L46,16 Z" />
          </vector>
          ICONEOF

          cp index.html android/app/src/main/assets/index.html

          cat > android/settings.gradle <<'SEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "IQIHLO_ES_TEH"
          include ":app"
          SEOF

          cat > android/build.gradle <<'BEOF'
          plugins {
              id 'com.android.application' version '8.9.0' apply false
          }
          BEOF

          cat > android/app/build.gradle <<'ABEOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace "com.iqihlo.esteh"
              compileSdk 35
              defaultConfig {
                  applicationId "com.iqihlo.esteh"
                  minSdk 23
                  targetSdk 35
                  versionCode 31
                  versionName "3.1"
              }
          }
          ABEOF

          cat > android/app/src/main/res/values/strings.xml <<'STEOF'
          <resources>
              <string name="app_name">IQIHLO ES TEH</string>
          </resources>
          STEOF

          cat > android/app/src/main/res/values/styles.xml <<'SLEOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#8D5200</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          SLEOF

          cat > android/app/src/main/AndroidManifest.xml <<'MEOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <application
                  android:theme="@style/AppTheme"
                  android:label="IQIHLO ES TEH"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MEOF

          cat > android/app/src/main/java/com/iqihlo/esteh/MainActivity.java <<'JEOF'
          package com.iqihlo.esteh;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.hardware.biometrics.BiometricPrompt;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.CancellationSignal;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.util.concurrent.Executor;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {
              private static final int CAMERA_REQUEST = 9001;
              private WebView webView;
              private final Executor executor = Executors.newSingleThreadExecutor();
              private CancellationSignal biometricCancellation;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                                  requestPermissions(new String[]{Manifest.permission.CAMERA}, CAMERA_REQUEST);
                                  request.deny();
                                  return;
                              }
                              String[] resources = request.getResources();
                              for (String resource : resources) {
                                  if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)) {
                                      request.grant(new String[]{PermissionRequest.RESOURCE_VIDEO_CAPTURE});
                                      return;
                                  }
                              }
                              request.deny();
                          });
                      }
                  });

                  webView.addJavascriptInterface(new AndroidPrintBridge(), "AndroidPrint");
                  webView.addJavascriptInterface(new AndroidBiometricBridge(), "AndroidBiometric");
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == CAMERA_REQUEST && grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      toast("Izin kamera aktif. Tekan SCAN KAMERA lagi.");
                  } else if (requestCode == CAMERA_REQUEST) {
                      toast("Izin kamera ditolak.");
                  }
              }

              private void toast(String text) {
                  Toast.makeText(this, text, Toast.LENGTH_SHORT).show();
              }

              private void sendJs(final String js) {
                  runOnUiThread(() -> webView.evaluateJavascript(js, null));
              }

              private void authenticate(String successJs, String failedJs, String title, String subtitle) {
                  if (Build.VERSION.SDK_INT < 28) {
                      toast("Sidik jari tidak tersedia pada versi Android ini.");
                      sendJs(failedJs);
                      return;
                  }
                  BiometricPrompt prompt = new BiometricPrompt.Builder(this)
                          .setTitle(title)
                          .setSubtitle(subtitle)
                          .setDescription("Verifikasi sidik jari untuk keamanan IQIHLO ES TEH")
                          .setNegativeButton("BATAL", executor, (dialog, which) -> sendJs(failedJs))
                          .build();
                  biometricCancellation = new CancellationSignal();
                  prompt.authenticate(biometricCancellation, executor, new BiometricPrompt.AuthenticationCallback() {
                      @Override public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {
                          sendJs(successJs);
                      }
                      @Override public void onAuthenticationError(int errorCode, CharSequence errString) {
                          sendJs(failedJs);
                      }
                      @Override public void onAuthenticationFailed() {
                          // BiometricPrompt tetap menunggu percobaan berikutnya.
                      }
                  });
              }

              private class AndroidBiometricBridge {
                  @JavascriptInterface
                  public void authenticateOwner() {
                      authenticate("window.ownerBiometricSuccess()", "window.ownerBiometricFailed()", "Verifikasi OWNER", "Akses Rekap Penjualan");
                  }
                  @JavascriptInterface
                  public void authenticateAttendance(String nama, String tipe) {
                      String safeNama = nama == null ? "Karyawan" : nama.replace("'", "\\'");
                      String safeTipe = tipe == null ? "ABSEN" : tipe.replace("'", "\\'");
                      authenticate("window.attendanceBiometricSuccess()", "window.attendanceBiometricFailed()", "Verifikasi Sidik Jari", safeNama + " • " + safeTipe);
                  }
              }

              private class AndroidPrintBridge {
                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(() -> cetakStruk());
                  }
              }

              private void cetakStruk() {
                  try {
                      PrintManager printManager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                      PrintAttributes.MediaSize mediaSize = new PrintAttributes.MediaSize("IQIHLO_58MM", "IQIHLO ES TEH 58mm", 2283, 3150);
                      PrintAttributes attributes = new PrintAttributes.Builder()
                              .setMediaSize(mediaSize)
                              .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                              .setColorMode(PrintAttributes.COLOR_MODE_MONOCHROME)
                              .build();
                      printManager.print("IQIHLO ES TEH", webView.createPrintDocumentAdapter("IQIHLO ES TEH"), attributes);
                  } catch (Exception e) {
                      Toast.makeText(this, "Gagal membuka cetak: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (biometricCancellation != null) biometricCancellation.cancel();
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          JEOF

      - name: Siapkan Gradle
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Cek lingkungan build
        shell: bash
        run: |
          java -version
          sdkmanager --version
          gradle --version

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: IQIHLO-ES-TEH-V3.1-PREMIUM-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Buat Release APK
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v3.1.${{ github.run_number }}
          name: IQIHLO ES TEH V3.1 PREMIUM
          body: |
            IQIHLO ES TEH V3.1 PREMIUM
            Perbaikan login role, scanner kamera, sidik jari native, dan struk 58mm.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
