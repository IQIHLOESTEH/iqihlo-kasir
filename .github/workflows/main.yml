name: Buat APK IQIHLO ES TEH V3.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      # =========================================
      # AMBIL KODE GITHUB
      # =========================================
      - name: Ambil kode
        uses: actions/checkout@v6


      # =========================================
      # JAVA 17
      # =========================================
      - name: Siapkan Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      # =========================================
      # ANDROID SDK
      # =========================================
      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false


      # =========================================
      # INSTALL ANDROID SDK
      # =========================================
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # =========================================
      # BUAT PROYEK ANDROID
      # =========================================
      - name: Buat proyek Android
        shell: bash
        run: |

          set -e

          mkdir -p android/app/src/main/java/com/iqihlo/esteh
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable


          # =====================================
          # ICON APK
          # =====================================
          cat > android/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#8D5200"
                  android:pathData="M22,24 L76,24 L76,66 C76,78 66,86 54,86 C42,86 32,78 32,66 L32,34 L22,34 L22,24 Z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M32,34 L66,34 L66,62 C66,70 61,76 54,76 C47,76 42,70 42,62 L42,42 L32,42 Z" />

              <path
                  android:fillColor="#D38A00"
                  android:pathData="M76,40 L84,40 C91,40 96,45 96,52 C96,59 91,64 84,64 L76,64 L76,57 L83,57 C86,57 88,55 88,52 C88,49 86,47 83,47 L76,47 Z" />

              <path
                  android:fillColor="#D38A00"
                  android:pathData="M42,24 L66,24 L62,16 L46,16 Z" />

          </vector>
          EOF


          # =====================================
          # MASUKKAN INDEX.HTML V3.0
          # =====================================
          cp index.html android/app/src/main/assets/index.html


          # =====================================
          # SETTINGS GRADLE
          # =====================================
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "IQIHLO_ES_TEH"

          include ":app"
          EOF


          # =====================================
          # BUILD GRADLE
          # =====================================
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.0' apply false
          }
          EOF


          # =====================================
          # APP BUILD GRADLE
          # =====================================
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace "com.iqihlo.esteh"

              compileSdk 35

              defaultConfig {

                  applicationId "com.iqihlo.esteh"

                  minSdk 23

                  targetSdk 35

                  versionCode 30

                  versionName "3.0"
              }
          }
          EOF


          # =====================================
          # STRING
          # =====================================
          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>

              <string name="app_name">
                  IQIHLO ES TEH
              </string>

          </resources>
          EOF


          # =====================================
          # STYLE
          # =====================================
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">
                      #000000
                  </item>

                  <item name="android:windowActionModeOverlay">
                      true
                  </item>

              </style>

          </resources>
          EOF


          # =====================================
          # ANDROID MANIFEST
          # =====================================
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.BLUETOOTH" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_ADMIN" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN" />

              <uses-permission
                  android:name="android.permission.CAMERA" />

              <uses-permission
                  android:name="android.permission.USE_BIOMETRIC" />


              <application

                  android:theme="@style/AppTheme"

                  android:label="IQIHLO ES TEH"

                  android:icon="@drawable/ic_launcher"

                  android:usesCleartextTraffic="true"

                  android:hardwareAccelerated="true">

                  <activity

                      android:name=".MainActivity"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          # =====================================
          # MAIN ACTIVITY
          # =====================================
          cat > android/app/src/main/java/com/iqihlo/esteh/MainActivity.java <<'EOF'
          package com.iqihlo.esteh;

          import android.app.Activity;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.content.Context;
          import android.webkit.WebSettings;


          public class MainActivity extends Activity {

              private WebView webView;


              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  webView = new WebView(this);


                  WebSettings settings =
                          webView.getSettings();


                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setMediaPlaybackRequiresUserGesture(false);


                  webView.setWebViewClient(
                          new WebViewClient()
                  );


                  webView.addJavascriptInterface(
                          new Object() {

                              @JavascriptInterface
                              public void print() {

                                  runOnUiThread(
                                          () -> cetakStruk()
                                  );
                              }

                          },
                          "AndroidPrint"
                  );


                  setContentView(webView);


                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );
              }


              private void cetakStruk() {

                  PrintManager printManager =
                          (PrintManager)
                                  getSystemService(
                                          Context.PRINT_SERVICE
                                  );


                  PrintAttributes.MediaSize mediaSize =
                          new PrintAttributes.MediaSize(

                                  "IQIHLO_58MM",

                                  "IQIHLO ES TEH 58mm",

                                  2283,

                                  3150
                          );


                  PrintAttributes attributes =
                          new PrintAttributes.Builder()

                                  .setMediaSize(
                                          mediaSize
                                  )

                                  .setMinMargins(
                                          PrintAttributes
                                                  .Margins
                                                  .NO_MARGINS
                                  )

                                  .setColorMode(
                                          PrintAttributes
                                                  .COLOR_MODE_MONOCHROME
                                  )

                                  .build();


                  printManager.print(

                          "IQIHLO ES TEH",

                          webView
                                  .createPrintDocumentAdapter(
                                          "IQIHLO ES TEH"
                                  ),

                          attributes
                  );
              }
          }
          EOF


      # =========================================
      # GRADLE
      # =========================================
      - name: Siapkan Gradle
        shell: bash
        run: |

          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q gradle-8.11.1-bin.zip

          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"


      # =========================================
      # CEK VERSI
      # =========================================
      - name: Cek lingkungan build
        shell: bash
        run: |

          java -version

          sdkmanager --version

          gradle --version


      # =========================================
      # BUILD APK
      # =========================================
      - name: Build APK
        shell: bash
        run: |

          set -e

          cd android

          gradle assembleDebug \
            --no-daemon \
            --stacktrace


      # =========================================
      # SIMPAN APK SEBAGAI ARTIFACT
      # =========================================
      - name: Simpan APK
        uses: actions/upload-artifact@v4

        with:

          name: IQIHLO-ES-TEH-V3.0-APK

          path:
            android/app/build/outputs/apk/debug/app-debug.apk

          if-no-files-found: error


      # =========================================
      # RELEASE APK
      # =========================================
      - name: Buat Release APK
        if: github.event_name == 'workflow_dispatch'

        uses: softprops/action-gh-release@v3

        with:

          tag_name: v3.0.${{ github.run_number }}

          name: IQIHLO ES TEH V3.0

          body: |
            IQIHLO ES TEH V3.0

            APK kasir IQIHLO ES TEH.

            Build:
            ${{ github.run_number }}

          files: |
            android/app/build/outputs/apk/debug/app-debug.apk

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
