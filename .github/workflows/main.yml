name: Buat APK IQIHLO ES TEH

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buat proyek Android
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "IQIHLO ES TEH" "com.iqihlo.esteh" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Buat APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: IQIHLO-ES-TEH-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
