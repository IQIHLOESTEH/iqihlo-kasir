name: Buat APK IQIHLO ES TEH V1.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Buat proyek Android
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/iqihlo/esteh
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/values

          cp index.html android/app/src/main/assets/index.html

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "IQIHLO_ES_TEH"
          include ":app"
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.0' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "com.iqihlo.esteh"
              compileSdk 35

              defaultConfig {
                  applicationId "com.iqihlo.esteh"
                  minSdk 23
                  targetSdk 35
                  versionCode 4
                  versionName "1.3"
              }
          }
          EOF

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">IQIHLO ES TEH</string>
          </resources>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="IQIHLO ES TEH"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#000000</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/java/com/iqihlo/esteh/MainActivity.java <<'EOF'
          package com.iqihlo.esteh;

          import android.app.Activity;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.content.Context;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.setWebViewClient(new WebViewClient());

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void print() {
                          runOnUiThread(() -> cetakStruk());
                      }
                  }, "AndroidPrint");

                  setContentView(webView);

                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void cetakStruk() {
                  PrintManager printManager =
                          (PrintManager) getSystemService(Context.PRINT_SERVICE);

                  PrintAttributes.MediaSize mediaSize =
                          new PrintAttributes.MediaSize(
                                  "IQIHLO_58MM",
                                  "IQIHLO ES TEH 58mm",
                                  2283,
                                  3150
                          );

                  PrintAttributes attributes =
                          new PrintAttributes.Builder()
                                  .setMediaSize(mediaSize)
                                  .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                  .setColorMode(PrintAttributes.COLOR_MODE_MONOCHROME)
                                  .build();

                  printManager.print(
                          "IQIHLO ES TEH",
                          webView.createPrintDocumentAdapter("IQIHLO ES TEH"),
                          attributes
                  );
              }
          }
          EOF

      - name: Siapkan Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: IQIHLO-ES-TEH-V1.3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Buat Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3
          name: IQIHLO ES TEH V1.3
          body: |
            APK IQIHLO ES TEH V1.3
            Versi dengan perbaikan fungsi cetak struk 58mm.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
