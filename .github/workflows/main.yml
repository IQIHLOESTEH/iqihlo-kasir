name: Buat APK IQIHLO ES TEH

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Buat proyek Android
        run: |
          mkdir -p android/app/src/main/java/com/iqihlo/esteh
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          cp index.html android/app/src/main/assets/index.html

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "IQIHLO_ES_TEH"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.0' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.iqihlo.esteh'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.iqihlo.esteh'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="IQIHLO ES TEH"
                  android:icon="@drawable/app_icon">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#000000</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/res/drawable/app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#FFD600"
                  android:pathData="M10,0 L98,0 Q108,0 108,10 L108,98 Q108,108 98,108 L10,108 Q0,108 0,98 L0,10 Q0,0 10,0Z"/>

              <path
                  android:fillColor="#7B3F00"
                  android:pathData="M31,28 L77,28 L72,73 Q71,81 64,82 L44,82 Q37,81 36,73Z"/>

              <path
                  android:fillColor="#C96A16"
                  android:pathData="M35,39 L73,39 L69,70 Q68,76 63,77 L45,77 Q40,76 39,70Z"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M29,27 Q29,23 34,23 L74,23 Q79,23 79,27 L79,31 L29,31Z"/>

              <path
                  android:fillColor="#6D3100"
                  android:pathData="M59,23 L64,23 L68,8 L63,7Z"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M40,43 L48,43 L46,51 L39,50Z M56,48 L64,48 L62,56 L54,54Z"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M18,88 L90,88 L90,99 L18,99Z"/>

              <path
                  android:fillColor="#6D3100"
                  android:pathData="M21,90 L87,90 L87,94 L21,94Z"/>

          </vector>
          EOF

          cat > android/app/src/main/java/com/iqihlo/esteh/MainActivity.java <<'EOF'
          package com.iqihlo.esteh;

          import android.app.Activity;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  webView.setWebViewClient(new WebViewClient());

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);

                  webView.addJavascriptInterface(new PrintBridge(), "AndroidPrint");

                  webView.loadUrl("file:///android_asset/index.html");

                  webView.setInitialScale(1);
                  setContentView(webView);

                  webView.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          webView.evaluateJavascript(
                              "window.print=function(){AndroidPrint.print();};",
                              null
                          );
                      }
                  }, 500);
              }

              private class PrintBridge {

                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              PrintManager printManager =
                                  (PrintManager) getSystemService(PRINT_SERVICE);

                              PrintAttributes attributes =
                                  new PrintAttributes.Builder()
                                      .setMediaSize(
                                          PrintAttributes.MediaSize.NA_INDEX_4X6
                                      )
                                      .setMinMargins(
                                          PrintAttributes.Margins.NO_MARGINS
                                      )
                                      .build();

                              printManager.print(
                                  "IQIHLO ES TEH - STRUK",
                                  webView.createPrintDocumentAdapter(
                                      "IQIHLO_ES_TEH"
                                  ),
                                  attributes
                              );
                          }
                      });
                  }
              }
          }
          EOF

          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          try:
              font_bold = ImageFont.truetype(
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 52
              )
              font_small = ImageFont.truetype(
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 18
              )
          except:
              font_bold = ImageFont.load_default()
              font_small = ImageFont.load_default()

          for folder, size in sizes.items():
              im = Image.new("RGB", (size, size), "#FFD600")
              d = ImageDraw.Draw(im)

              # gelas
              d.rounded_rectangle(
                  (int(size*.28), int(size*.25), int(size*.72), int(size*.78)),
                  radius=max(2, int(size*.05)),
                  fill="#7B3F00",
                  outline="white",
                  width=max(1, int(size*.025))
              )
              d.rectangle(
                  (int(size*.32), int(size*.38), int(size*.68), int(size*.73)),
                  fill="#C96A16"
              )

              # es
              d.polygon([
                  (int(size*.38),int(size*.44)),
                  (int(size*.49),int(size*.42)),
                  (int(size*.46),int(size*.54)),
                  (int(size*.35),int(size*.52))
              ], fill="white")

              d.polygon([
                  (int(size*.53),int(size*.49)),
                  (int(size*.64),int(size*.47)),
                  (int(size*.62),int(size*.58)),
                  (int(size*.51),int(size*.57))
              ], fill="white")

              # sedotan
              d.line(
                  (int(size*.56),int(size*.28),
                   int(size*.64),int(size*.08)),
                  fill="#5A2800",
                  width=max(2, int(size*.055))
              )

              # nama
              text = "IQIHLO"
              box = d.textbbox((0,0), text, font=font_bold)
              tw = box[2]-box[0]
              th = box[3]-box[1]
              d.text(
                  ((size-tw)/2, int(size*.77)-th/2),
                  text,
                  font=font_bold,
                  fill="white",
                  stroke_width=max(1,int(size*.015)),
                  stroke_fill="#5A2800"
              )

              im.save(
                  f"android/app/src/main/res/{folder}/ic_launcher.png"
              )

          # Ikon besar dengan IG
          size = 512
          im = Image.new("RGB", (size,size), "#FFD600")
          d = ImageDraw.Draw(im)
          font1 = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 82
          )
          font2 = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 28
          )

          d.rounded_rectangle((105,115,407,390), radius=30,
                              fill="#7B3F00", outline="white", width=12)
          d.rectangle((130,180,382,360), fill="#C96A16")

          d.polygon([(155,210),(230,200),(215,270),(145,255)], fill="white")
          d.polygon([(270,230),(350,215),(335,290),(255,275)], fill="white")

          d.line((280,125,330,45), fill="#5A2800", width=28)

          text="IQIHLO"
          box=d.textbbox((0,0),text,font=font1)
          d.text(((size-(box[2]-box[0]))/2,365),text,
                 font=font1,fill="white",stroke_width=7,stroke_fill="#5A2800")

          text2="@iqihlo.esteh"
          box=d.textbbox((0,0),text2,font=font2)
          d.rounded_rectangle((60,455,452,500),radius=18,fill="white")
          d.text(((size-(box[2]-box[0]))/2,462),text2,
                 font=font2,fill="#5A2800")

          im.save("android/app/src/main/res/drawable/app_icon_big.png")
          PY

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Buat APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: IQIHLO-ES-TEH-APK-FINAL
          path: android/app/build/outputs/apk/debug/app-debug.apk
