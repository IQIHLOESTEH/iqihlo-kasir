name: Buat APK IQIHLO ES TEH V1.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Buat proyek Android
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/iqihlo/esteh
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/values

          cp index.html android/app/src/main/assets/index.html

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "IQIHLO_ES_TEH"
          include ":app"
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.9.0" apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.iqihlo.esteh"
              compileSdk 35

              defaultConfig {
                  applicationId "com.iqihlo.esteh"
                  minSdk 23
                  targetSdk 35
                  versionCode 4
                  versionName "1.3"
              }
          }
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#925500</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="IQIHLO ES TEH"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android/app/src/main/java/com/iqihlo/esteh/MainActivity.java <<'EOF'
          package com.iqihlo.esteh;

          import android.app.Activity;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  webView.addJavascriptInterface(
                      new PrintBridge(),
                      "AndroidPrint"
                  );

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(
                          WebView view,
                          String url
                      ) {
                          view.evaluateJavascript(
                              "window.print=function(){AndroidPrint.print();};",
                              null
                          );
                      }
                  });

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }

              private class PrintBridge {

                  @JavascriptInterface
                  public void print() {

                      runOnUiThread(() -> {

                          try {

                              PrintManager manager =
                                  (PrintManager)
                                  getSystemService(PRINT_SERVICE);

                              PrintAttributes.MediaSize size =
                                  new PrintAttributes.MediaSize(
                                      "IQIHLO_58MM",
                                      "IQIHLO 58mm",
                                      2283,
                                      3150
                                  );

                              PrintAttributes attributes =
                                  new PrintAttributes.Builder()
                                      .setMediaSize(size)
                                      .setMinMargins(
                                          PrintAttributes.Margins.NO_MARGINS
                                      )
                                      .setColorMode(
                                          PrintAttributes.COLOR_MODE_MONOCHROME
                                      )
                                      .build();

                              manager.print(
                                  "IQIHLO ES TEH - STRUK",
                                  webView.createPrintDocumentAdapter(
                                      "IQIHLO_ES_TEH"
                                  ),
                                  attributes
                              );

                          } catch (Exception e) {

                              Toast.makeText(
                                  MainActivity.this,
                                  "Gagal membuka cetak: "
                                  + e.getMessage(),
                                  Toast.LENGTH_LONG
                              ).show();

                          }

                      });
                  }
              }
          }
          EOF

      - name: Download Gradle
        working-directory: android
        run: |
          curl -L --fail \
            -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q gradle.zip
          mv gradle-8.11.1 gradle-dist

      - name: Build APK
        working-directory: android
        run: |
          ./gradle-dist/bin/gradle \
            --no-daemon \
            assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: IQIHLO-ES-TEH-V1.3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
