<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IQIHLO ES TEH - Kasir</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:15px}
.box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:15px}
h1{text-align:center;margin:5px 0;font-size:30px}
h3{text-align:center;margin:0 0 18px}
label{display:block;margin-top:12px;font-weight:bold}
input{width:100%;padding:12px;margin-top:5px;border:1px solid #888;border-radius:7px;font-size:16px}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.cat{background:#eee;color:#111;border:1px solid #bbb;border-radius:8px;padding:12px;font-weight:bold}
.cat.active{background:#111;color:#fff}
.menus{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.menu{background:#111;color:#fff;border:0;border-radius:9px;padding:14px 8px;font-weight:bold;min-height:60px}
.menu small{display:block;font-weight:normal;margin-top:5px}
.cart{margin-top:20px;border-top:2px dashed #111;padding-top:10px}
.row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #ddd}
.name{flex:1}
.minus,.plus{width:36px;padding:7px;border:0;border-radius:6px;background:#ddd;font-size:18px}
.total{font-size:24px;font-weight:bold;text-align:right;margin:18px 0}
.print{width:100%;padding:14px;background:#111;color:#fff;border:0;border-radius:8px;font-weight:bold;font-size:16px}
.clear{width:100%;padding:10px;margin-top:8px;background:#fff;border:1px solid #111;border-radius:8px}
.settings{margin-top:20px;border-top:1px solid #ccc;padding-top:12px}
.priceRow{display:flex;align-items:center;gap:8px;margin:7px 0}
.priceRow span{flex:1;font-size:14px}
.priceRow input{width:130px;margin:0;padding:8px}

.receipt{display:none}

@media print{
body{background:white;padding:0}
.box{display:none}
.receipt{display:block;width:58mm;font-family:monospace;font-size:12px}
.center{text-align:center}
.line{border-top:1px dashed #000;margin:8px 0}
.rrow{display:flex;justify-content:space-between}
}
</style>
</head>

<body>

<div class="box">

<h1>IQIHLO ES TEH</h1>
<h3>SEGARNYA BEDA!</h3>

<label>Nama Pelanggan</label>
<input id="nama" placeholder="Nama pelanggan">

<label>Pilih Kategori</label>
<div class="cats" id="cats"></div>

<label>Pilih Menu</label>
<div class="menus" id="menus"></div>

<div class="cart">
<b>DAFTAR PESANAN</b>
<div id="cartList"></div>
</div>

<div class="total">
TOTAL: <span id="total">Rp0</span>
</div>

<button class="print" onclick="cetak()">CETAK STRUK</button>
<button class="clear" onclick="resetPesanan()">KOSONGKAN PESANAN</button>
