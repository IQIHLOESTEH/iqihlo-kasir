<style>

*{

html,body{

button,

<script>
'use strict';

/* =========================
   DATABASE IQIHLO ES TEH
========================= */

const CATS=[
  'Es Teh',
  'Es Jeruk Peras',
  'Goodday Biasa',
  'Nutrisari',
  'Susu',
  'Teh Tarik Maxtea',
  'Kopi Susu',

];

const MENU=[
 ['Es Teh',3000],
 ['Es Jeruk Peras',5000],
 ['Mocacino',5000],
 ['Vanilla Latte',5000],
 ['Coolant',5000],
 ['Chococino',5000],
 ['Carebian Nut',5000],
 ['Mangga',4000],
 ['Jeruk Peras',4000],
 ['Cincau',4000],
 ['Milky Orange',4000],
 ['Putih',5000],
 ['Coklat',5000],
 ['Matcha',5000],
 ['Milo',5000],
 ['Teh Tarik Maxtea',5000],
 ['Tora Bika Creamy',5000],
 ['Indocafe',5000],
 ['White Coffee',5000],
 ['Kopi Kapal Api',3000],
 ['Kopi ABC',3000],
 ['Creamy',5000],
 ['Butterscotch',5000],
 ['Original',5000],
 ['Air Putih Es',2000],
 ['Air Putih Panas',2000]
];

const KEYS={
 accounts:'iqihlo_accounts_v7',
 menus:'iqihlo_menus_v7',
 tx:'iqihlo_tx_v7',
 employees:'iqihlo_employees_v7',
 att:'iqihlo_att_v7',
 stock:'iqihlo_stock_v7',
 barcodes:'iqihlo_barcodes_v7',
 market:'iqihlo_market_v7',
 printer:'iqihlo_printer_v7'
};

const DEFAULT_ACCOUNTS=[
  {
    u:'iqihloesteh',
    p:'Bakmimania2108',
    r:'OWNER',
    active:true,
    email:'iqihloesteh@gmail.com'
  }
];

let accounts=[];
let menus=[];
let tx=[];
let employees=[];
let att=[];
let stock={};
let barcodes={};
let market=[];
let cart=[];
let category=CATS[0];
let payment='Cash';
let session=null;
let selectedPrinter=null;
let lastReceipt=null;
let reportMode='today';
let cameraStream=null;
let scanRunning=false;

const $=id=>document.getElementById(id);

function load(k,d){
 try{
  const x=localStorage.getItem(k);
  return x?JSON.parse(x):d;
 }catch(e){
  return d;
 }
}

function save(k,v){
 localStorage.setItem(k,JSON.stringify(v));

 if(
  window.IQIHLO_CLOUD &&
  !window.IQIHLO_CLOUD.applying
 ){
  window.IQIHLO_CLOUD.save(k,v);
 }
}

/* =========================
   FIREBASE CLOUD SYNC
========================= */

const CLOUD_KEY_MAP={
 'iqihlo_accounts_v7':'accounts',
 'iqihlo_menus_v7':'menus',
 'iqihlo_tx_v7':'tx',
 'iqihlo_employees_v7':'employees',
 'iqihlo_att_v7':'att',
 'iqihlo_stock_v7':'stock',
 'iqihlo_barcodes_v7':'barcodes',
 'iqihlo_market_v7':'market'
};

function applyCloudData(data){

 if(!data || !Object.keys(data).length){
  return;
 }

 const oldApplying=
  window.IQIHLO_CLOUD?.applying;

 if(window.IQIHLO_CLOUD){
  window.IQIHLO_CLOUD.applying=true;
 }

 try{

  Object.entries(data).forEach(([key,value])=>{

   if(
    key===KEYS.accounts &&
    Array.isArray(value)
   ){
    handleCloudAccounts(value);
   }

   if(
    key===KEYS.menus &&
    Array.isArray(value)
   ){
    menus=value;
   }

   if(
    key===KEYS.tx &&
    Array.isArray(value)
   ){
    tx=value;
   }

   if(
    key===KEYS.employees &&
    Array.isArray(value)
   ){
    employees=value;
   }

   if(
    key===KEYS.att &&
    Array.isArray(value)
   ){
    att=value;
   }

   if(
    key===KEYS.stock &&
    value &&
    typeof value==='object'
   ){
    stock=value;
   }

   if(
    key===KEYS.barcodes &&
    value &&
    typeof value==='object'
   ){
    barcodes=value;
   }

   if(
    key===KEYS.market &&
    Array.isArray(value)
   ){
    market=value;
   }

  });

  Object.entries(data).forEach(([key,value])=>{

   try{
    localStorage.setItem(
     key,
     JSON.stringify(value)
    );
   }catch(e){}

  });

  renderCats();
  renderMenus();
  renderManagers();
  renderEmployees();
  renderStock();
  renderBarcode();
  renderMarket();
  renderReport();
  renderHistory();
  renderStats();

 }finally{

  if(window.IQIHLO_CLOUD){
   window.IQIHLO_CLOUD.applying=
    !!oldApplying;
  }

 }
}

window.IQIHLO_APPLY_CLOUD=applyCloudData;

async function connectFirebaseForCurrentSession(){

 if(
  !window.IQIHLO_CLOUD ||
  !window.IQIHLO_CLOUD.user
 ){
  return;
 }

 try{

  const email=
   window.IQIHLO_CLOUD.user.email;

  if(email){

   const snap=
    await window.IQIHLO_CLOUD.db
     .collection('users')
     .doc(email)
     .get();

   if(snap.exists){

    const d=snap.data()||{};

    const a=
     accounts.find(
      x=>x.u==='iqihloesteh'
     );

    if(a){

     if(d.role){
      a.r=
       String(d.role).toUpperCase();
     }

     if(d.active!==undefined){
      a.active=
       d.active!==false;
     }

     a.email=email;

    }

   }

  }

  await window.IQIHLO_CLOUD.sync();

  await refreshCloudAccounts();

 }catch(e){

  console.error(
   'Firebase account sync failed:',
   e
  );

 }
}

window.IQIHLO_APPLY_AUTH=function(user){

 if(document.readyState!=='loading'){
  connectFirebaseForCurrentSession();
 }

};

function rupiah(n){
 return 'Rp'+
  Number(n||0).toLocaleString('id-ID');
}

function esc(s){

 return String(s??'').replace(
  /[&<>"']/g,
  m=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#39;'
  }[m])
 );

}

function guessCat(n){

 if(n==='Es Teh')
  return 'Es Teh';

 if(n==='Es Jeruk Peras')
  return 'Es Jeruk Peras';

 if(n.includes('Air Putih'))
  return 'Air Putih';

 if([
  'Mangga',
  'Jeruk Peras',
  'Cincau',
  'Milky Orange'
 ].includes(n))
  return 'Nutrisari';

 if(n.includes('Teh Tarik'))
  return 'Teh Tarik Maxtea';

 if(
  n.includes('Kopi ABC') ||
  n.includes('Kapal Api')
 )
  return 'Kopi Hitam';

 if(n.includes('Kopi'))
  return 'Kopi Susu';

 if([
  'Milo',
  'Putih'
 ].includes(n))
  return 'Susu';

 if(
  n.includes('Choc') ||
  n==='Coklat'
 )
  return 'Chocolatos';

 if(
  n.includes('Latte') ||
  [
   'Mocacino',
   'Creamy',
   'Butterscotch'
  ].includes(n)
 )
  return 'Goodday Latte';

 return 'Goodday Biasa';
}

function normalizeAccount(x){

 const u=
  String(x?.u||'')
   .trim()
   .toLowerCase();

 if(!u){
  return null;
 }

 const isOwner=
  u==='iqihloesteh';

 return {
  u,
  p:String(x?.p||''),
  r:
   isOwner
    ? 'OWNER'
    :
      (
       String(
        x?.r||'KASIR'
       ).toUpperCase()==='OWNER'
        ? 'ADMIN'
        :
        String(
         x?.r||'KASIR'
        ).toUpperCase()
      ),
  active:
   isOwner
    ? true
    : x?.active!==false,
  email:
   String(x?.email||'')
 };
}

function normalizeAccounts(list){

 const out=[];

 (
  Array.isArray(list)
   ? list
   : []
 ).forEach(x=>{

  const a=
   normalizeAccount(x);

  if(
   a &&
   !out.some(
    y=>y.u===a.u
   )
  ){
   out.push(a);
  }

 });

 let owner=
  out.find(
   x=>x.u==='iqihloesteh'
  );

 if(!owner){

  owner={
   u:'iqihloesteh',
   p:'Bakmimania2108',
   r:'OWNER',
   active:true,
   email:'iqihloesteh@gmail.com'
  };

  out.unshift(owner);

 }else{

  owner.r='OWNER';
  owner.active=true;
  owner.p=
   owner.p||'Bakmimania2108';
  owner.email=
   owner.email||
   'iqihloesteh@gmail.com';

 }

 return out;
}

async function refreshCloudAccounts(){

 if(
  !window.IQIHLO_CLOUD?.user
 ){
  return false;
 }

 try{

  const snap=
   await window.IQIHLO_CLOUD.db
    .collection('app_data')
    .doc(KEYS.accounts)
    .get();

  if(!snap.exists){

   if(
    window.IQIHLO_CLOUD.user.email===
     'iqihloesteh@gmail.com'
    ||
    session?.r==='OWNER'
   ){

    accounts=
     normalizeAccounts(accounts);

    await window.IQIHLO_CLOUD.save(
     KEYS.accounts,
     accounts
    );

    renderAccounts();

    return true;

   }

   return false;
  }

  const raw=
   snap.data()||{};

  const list=
   Array.isArray(raw.data)
    ? raw.data
    :
   Array.isArray(raw.accounts)
    ? raw.accounts
    :
   Array.isArray(raw)
    ? raw
    : [];

  accounts=
   normalizeAccounts(
    list.length
     ? list
     : accounts
   );

  localStorage.setItem(
   KEYS.accounts,
   JSON.stringify(accounts)
  );

  renderAccounts();

  enforceCurrentAccount();

  return true;

 }catch(e){

  console.error(
   'Cloud accounts refresh failed:',
   e
  );

  return false;
 }
}

function enforceCurrentAccount(){

 if(!session){
  return true;
 }

 const current=
  accounts.find(
   x=>x.u===session.u
  );

 if(!current){

  lockApp(false);

  $('loginMsg').textContent=
   'Akun tidak ditemukan.';

  return false;
 }

 if(
  current.u!=='iqihloesteh' &&
  current.active===false
 ){

  lockApp(false);

  $('loginMsg').textContent=
   'Akun ini sedang dinonaktifkan oleh Owner.';

  return false;
 }

 session={
  ...current
 };

 sessionStorage.setItem(
  'iqihlo_session',
  JSON.stringify(session)
 );

 applySession();

 return true;
}

async function loginSystem(){

 const u=
  $('loginUser')
   .value
   .trim()
   .toLowerCase();

 const p=
  $('loginPass').value;

 if(!u||!p){

  $('loginMsg').textContent=
   'Username dan password wajib diisi.';

  return;
 }

 $('loginMsg').textContent=
  'Memeriksa akun...';

 try{

  if(u==='iqihloesteh'){

   await window.IQIHLO_CLOUD.signIn(
    'iqihloesteh@gmail.com',
    p
   );

   await window.IQIHLO_CLOUD.sync();

   await refreshCloudAccounts();

  }else{

   if(
    !window.IQIHLO_CLOUD?.auth?.currentUser
   ){

    await window.IQIHLO_CLOUD
     .signInAnonymous();

   }

   await refreshCloudAccounts();

  }

  const a=
   accounts.find(
    x=>x.u===u
   );

  if(!a){

   $('loginMsg').textContent=
    'Username atau password salah.';

   return;
  }

  if(a.p!==p){

   $('loginMsg').textContent=
    'Username atau password salah.';

   return;
  }

  if(
   a.u!=='iqihloesteh' &&
   a.active===false
  ){

   $('loginMsg').textContent=
    'Akun ini sedang dinonaktifkan oleh Owner.';

   return;
  }

  session={
   ...a
  };

  sessionStorage.setItem(
   'iqihlo_session',
   JSON.stringify(session)
  );

  $('loginMsg').textContent='';

  applySession();

  if(a.u!=='iqihloesteh'){

   await window.IQIHLO_CLOUD.sync();

  }

 }catch(e){

  console.error(
   'Login failed:',
   e
  );

  const code=
   e?.code||'';

  if(
   code==='auth/wrong-password'||
   code==='auth/user-not-found'||
   code==='auth/invalid-credential'
  ){

   $('loginMsg').textContent=
    'Password Owner salah.';

  }else{

   $('loginMsg').textContent=
    e?.message||
    'Login gagal. Periksa username dan password.';

  }

 }
}

function applySession(){

  .classList
  .toggle('hidden',logged);

 $('app')
  .classList
  .toggle('hidden',!logged);

 if(!logged){
  return;
 }

 $('currentUser').textContent=
  session.u;

 $('currentRole').textContent=
  session.r;

  session.u;

function restoreSession(){

 try{

  const saved=
   JSON.parse(
    sessionStorage.getItem(
     'iqihlo_session'
    )||'null'
   );

  session=
   saved&&saved.u
    ? {...saved}
    : null;

 }catch(e){

  session=null;

 }

 if(session){

  const a=
   accounts.find(
    x=>x.u===session.u
   );

  if(
   !a ||
   (
    a.u!=='iqihloesteh' &&
    a.active===false
   )
  ){

   session=null;

   sessionStorage.removeItem(
    'iqihlo_session'
   );

  }else{

   session={
    ...a
   };

  }

 }

 applySession();

}

function lockApp(clearMessage=true){

 stopBarcodeCamera();

 if(window.IQIHLO_CLOUD){

  window.IQIHLO_CLOUD
   .listeners
   ?.forEach(
    u=>{
     try{
      u();
     }catch(e){}
    }
   );

  window.IQIHLO_CLOUD.listeners=[];

  window.IQIHLO_CLOUD.ready=false;

  window.IQIHLO_CLOUD
   .signOut()
   .catch(()=>{});

 }

 session=null;

 sessionStorage.removeItem(
  'iqihlo_session'
 );

 $('loginPass').value='';

 if(clearMessage){
  $('loginMsg').textContent='';
 }

 applySession();

}

function exitApp(){

  return;
 }

 if(
  window.AndroidApp &&
  typeof AndroidApp.exitApp==='function'
 ){

 }else{

  lockApp();

 }

}

function goFeatureFromMenu(keyword){

 closeMenu();

 const features=
  document.querySelector(
   '.features'
  );

 if(!features){
  return;
 }

 features.classList.add(
  'show-feature'
 );

 const details=
  [
   ...features.querySelectorAll(
    '.details'
   )
  ];

 details.forEach(
  d=>d.open=false
 );

 const target=
  details.find(
   d=>
    d.textContent
     .toUpperCase()
     .includes(
      keyword.toUpperCase()
     )
  );

 if(!target){

  if(keyword==='KASIR'){
   openCart();
   return;
  }

  return;
 }

 target.open=true;

 target.scrollIntoView({
  behavior:'smooth',
  block:'start'
 });

 if(keyword==='RIWAYAT'){
  renderHistory();
 }

 if(keyword==='LAPORAN'){
  renderReport();
 }

 if(keyword==='BARCODE'){
  renderBarcode();
 }

 if(keyword==='STOK'){
  renderStock();
 }

 if(keyword==='PESANAN'){
  renderMarket();
 }

 if(keyword==='KARYAWAN'){
  renderEmployees();
 }

}
